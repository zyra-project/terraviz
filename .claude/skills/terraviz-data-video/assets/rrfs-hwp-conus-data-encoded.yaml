# RRFS Hourly Wildfire Potential (WFIREPOT) — 3 km CONUS, data-encoded.
#
# The fire-side companion to the RRFS smoke datasets: WFIREPOT is what the
# model's smoke emissions are driven from, so this reads as the upstream of
# "vertically integrated smoke".
#
# SOURCE (checked 2026-08-02, .idx record 186 of 318):
#   rrfs_public/.../rrfs.tHHz.2dfld.3km.fNNN.conus.grib2  ->  WFIREPOT:surface
#
#   WFIREPOT is NOT in rrfs_a/.../rrfs.tHHz.subset.3km.fNNN.na.grib2 — the
#   curated 3 km North American subset that backs the smoke datasets carries
#   COLMD/MASSDEN but no fire-potential record at any forecast hour. The only
#   other source that has it is 2dfld.13km.na (North America, but 13 km and
#   3-hourly / 29 frames). Hourly 3 km therefore means CONUS; that tradeoff is
#   the reason this pipeline is CONUS-only.
#
# CADENCE: the 85-frame 84-hour run is posted at 00/06/12/18Z only (cycle 01Z
#   carries 18 frames, 03Z carries 37) — hence PT6H cycle stepping, not PT1H.
#   f084 lands ~3-3.5 h after cycle time, so PT6H lag has ~2.5 h of margin.
#
# CALIBRATION: pooled f021/f045/f069 of the 2026-08-02 00Z cycle (5.7M points,
#   no bitmap, all points valid): max 132.4, 48.3% exact zeros, p99 86.6,
#   p99.9 106, p99.99 120.3. vmax 120 ~= p99.99 — clipping the top 0.1% of a
#   *fire danger* field is precisely the wrong thing to clip, so this rounds up
#   from p99.9 rather than down.
#
# PALETTE: YlOrRd — light-starting (pale yellow reads on the black globe) with
#   fire semantics, and distinct from the smoke datasets' YlOrBr. With
#   transparent_range 12 the transparent band is luma <12/256 -> value <5.6,
#   which lands just above the 48% of the grid that is exact zero: no-fire-risk
#   ground stays clear, every nonzero value renders.
#
# DATA-ENCODED CONTRACT: heatmap carries data_encoded + color_scale_file +
#   cmap_inline (a named --cmap is IGNORED here); NO width/height/basemap on
#   heatmap; 4K comes from reproject regridding the DATA; compose-video has NO
#   preset: sos (it would rescale and average the luma).
stages:
  - stage: process
    command: convert-format
    args:
      format: geotiff
      pattern: 'WFIREPOT:surface'
      output_dir: /work/tif
      inputs:
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT6H}}/{{cycle_hour:PT6H:PT6H}}/rrfs.t{{cycle_hour:PT6H:PT6H}}z.2dfld.3km.f000.conus.grib2

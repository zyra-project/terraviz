[package]
name = "terraviz"
version = "0.1.0"
description = "Terraviz — NOAA Science On a Sphere desktop app"
license = "Apache-2.0"
authors = ["Zyra Project"]
edition = "2021"

# Library target — required by Android (cdylib) and iOS (staticlib).
# Desktop binary in src/main.rs links against this lib via `rlib`.
[lib]
name = "terraviz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["fs", "sync"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tauri-plugin-http = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-apple-intelligence = { path = "plugins/apple-intelligence" }

# Desktop-only dependencies. The keyring crate has no Android backend, and
# the updater plugin is unsupported on mobile (App Store / Play Store handle
# updates). See docs/MOBILE_APP_PLAN.md.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# 2.14.1 is the first release on zip ^9; earlier 2.x pin zip ^4, which
# carries GHSA-m665-v7pm-7grj (critical) and five more extraction
# advisories. The floor keeps a lock regeneration from going back.
tauri-plugin-updater = "2.14.1"

# iOS keeps the real keychain backend (apple-native covers macOS + iOS) but
# does not get the updater plugin.
[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Enables `tauri::test`'s MockRuntime so the ACL tests in `lib.rs` can put a
# real `InvokeRequest` through the real capability files. Cargo's v2 resolver
# keeps dev-dependency features out of a normal build, so this does not reach
# the shipped binary.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

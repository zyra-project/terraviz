name: CI

on:
  # `push` only on main so the production deploy fires on merge.
  # Branch CI + preview deploys come from the `pull_request` trigger
  # below, so a single push to a branch with an open PR no longer
  # races a duplicate deploy against Cloudflare Pages (the previous
  # `branches: ['**']` shape ran the whole pipeline twice and
  # produced sporadic "must be valid UTF-8" errors when the two
  # deploys hit the same project + commit-hash simultaneously).
  push:
    branches: [main]
  # `claude/**` alongside main so a *stacked* PR is verified too. A
  # branch too large to review in one piece gets frozen and the next
  # phase branched off it, with the follow-up PR targeting that branch
  # rather than main — which kept the diff reviewable but, with a
  # `[main]`-only filter here, silently meant no type-check, no unit
  # tests and no build ran on it at all. The gap was invisible from the
  # PR page: the checks were not red, they were absent, and the only
  # tell was a stacked PR reporting four checks where a main-targeted
  # one reports eighteen.
  #
  # Consequence worth knowing: the `deploy` job below is gated on event
  # and fork, not on base branch, so stacked PRs now get a preview
  # deploy as well. That is the same treatment every other PR gets and
  # is useful for reviewing stacked UI work; gating it by base instead
  # would add a conditional with more ways to be subtly wrong than the
  # extra deploy is worth.
  pull_request:
    branches: [main, 'claude/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only on the GITHUB_TOKEN; the deploy job uses
# Cloudflare API credentials (not GITHUB_TOKEN), so no write scopes
# are required. CodeQL flags workflows without an explicit
# `permissions:` block as a hardening miss.
permissions:
  contents: read

jobs:
  # An invalid workflow is not a failing step — GitHub stops loading
  # the file, so nothing runs and nothing goes red. #316 shipped a
  # `cancelled()` call inside a `run:` block that way and silently
  # disabled zyra-run.yml, the workflow behind every scheduled
  # pipeline. Nothing else in CI can catch that, because the broken
  # file is the one that would have reported it.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned by version and checksum rather than pulled from a
      # marketplace action: this job exists to be the backstop, so its
      # own supply chain shouldn't be a moving target.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      # Pass the files explicitly. Invoked bare, actionlint locates
      # the project by walking up for a `.git` directory, and when it
      # can't find one it prints "no project was found" and exits 0 —
      # a green job that checked nothing. The empty-list guard makes
      # "found no workflows" fail loudly for the same reason.
      #
      # shellcheck is preinstalled on ubuntu-latest and actionlint
      # picks it up automatically, so this also lints every `run:`
      # block. Reproduce a failure locally with the same pairing —
      # actionlint on its own reports strictly less.
      - name: Lint workflows
        run: |
          set -euo pipefail
          mapfile -t WORKFLOWS < <(
            find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          )
          if [ "${#WORKFLOWS[@]}" -eq 0 ]; then
            echo "::error::no workflow files found to lint"
            exit 1
          fi
          echo "linting ${#WORKFLOWS[@]} workflow file(s)"
          ./actionlint -color "${WORKFLOWS[@]}"

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      # Both pages are generated and committed. `npm run build`
      # regenerates them via `prebuild`, so a stale copy in the tree is
      # invisible there — it only shows up as a diff after someone
      # else builds. These are the checks that catch it.
      - run: npm run check:privacy-page
      - run: npm run check:setup-page
      # The install guide is read by people standing up a node for a
      # museum or a lab, often mid-incident. Long sentences are where
      # that reader is lost, so long sentences fail the build.
      - run: npm run check:plain-language

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # SOS deployment ships 1.5 (§7.1) as the first-launch UI
          # size for its kiosk audience. Set as a GitHub Variable
          # (Settings → Environments → production → Variables);
          # unset evaluates to '' which uiScaleService rejects and
          # falls through to 1.0, so non-production builds boot at
          # the universal default.
          VITE_DEFAULT_UI_SCALE: ${{ vars.VITE_DEFAULT_UI_SCALE }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      # Production URL shown in GitHub's Deployments UI / the PR
      # "deployed" badge. Cosmetic only — does not affect where
      # wrangler deploys (that's --project-name below). Sourced from
      # the TERRAVIZ_SERVER *Variable* so forks pick up their own
      # hostname without editing this file. NOTE: the `secrets` context
      # is not available in `environment.url` (GitHub rejects it), so
      # this must be a Variable (Settings → Variables, repo or the
      # `production` Environment), not the secret transcode-hls.yml
      # reads. Set it to the same value, e.g. https://terraviz.test.gsl.noaa.gov.
      # Unset → '' (no link rendered).
      url: ${{ github.ref == 'refs/heads/main' && vars.TERRAVIZ_SERVER || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The one place a pointer stub would reach the public. `lfs: true`
      # above is what prevents it; this is what notices if that line is
      # ever removed or the fetch silently fails, because the build
      # itself will not — vite copies public/ without looking inside, so
      # a stub deploys as a .jpg and the globe loses its stars with
      # nothing in the log. --strict here only; see scripts/check-lfs.ts
      # for why it must not gate the PR builds that skip LFS on purpose.
      - run: npm run check:lfs -- --strict
      - run: npm run build
        env:
          # Same passthrough as the build job above — the deploy
          # job re-runs the build so the production bundle carries
          # the production-environment Variables (1.5 for the SOS
          # deploy, '' / 1.0 for preview).
          VITE_DEFAULT_UI_SCALE: ${{ vars.VITE_DEFAULT_UI_SCALE }}
      # Apply pending CATALOG_DB migrations to the REMOTE before the new
      # Functions go live, so additive schema (new tables/columns) is
      # present when the new code lands. `wrangler d1 migrations apply`
      # is idempotent — it tracks applied files in `d1_migrations` and
      # only runs pending ones, so re-running every deploy is a no-op
      # when current.
      #
      # CATALOG_DB only, and now for one reason rather than two. The
      # original reason is gone: FEEDBACK_DB's migrations_dir used to
      # hold the generated `catalog-schema.sql` snapshot, which wrangler
      # would queue as a feedback "migration" and use to create catalog
      # tables in the wrong place. That file lives in `schema/` now, so
      # `migrations/` holds migrations and nothing else.
      #
      # What remains is a scope decision: the two bindings point at the
      # same physical D1, so the catalog migrations are all the catalog
      # backend / hero feature needs, and feedback-DB schema changes are
      # rare enough to apply by hand (docs/SELF_HOSTING.md Phase 8).
      # Auto-applying FEEDBACK_DB here would now be safe — it is simply
      # not needed.
      #
      # Gated to `main` only: preview and production point at the SAME
      # physical D1 instance (one database_id in wrangler.toml), so
      # applying on a preview PR would mutate the production schema
      # before the code merges. Never run this on the preview path.
      #
      # OPT-IN: off by default. Set the repo/Environment variable
      # ENABLE_D1_MIGRATE=1 to turn it on — and only after granting the
      # CI token **D1:Edit** (Account → D1 → Edit). A deploy-only token
      # produces a Cloudflare 7403/7500 here and would block the
      # deploy, so the safe default is off (forks aren't broken out of
      # the box). See docs/SELF_HOSTING.md.
      #
      # `check:migrations` (in the type-check job) guarantees every
      # migration is additive or explicitly reviewed-destructive, which
      # is what makes apply-before-deploy safe.
      - name: Apply D1 migrations (remote, main only)
        if: github.ref == 'refs/heads/main' && vars.ENABLE_D1_MIGRATE == '1'
        run: |
          set -o pipefail
          # Select by BINDING name (not the shared database_name) so
          # wrangler resolves migrations/catalog/.
          npx wrangler@4 d1 migrations apply CATALOG_DB --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          # Stream wrangler output live AND capture it for preview-URL extraction.
          # The previous `DEPLOY_OUTPUT=$(wrangler ...)` pattern silently swallowed
          # wrangler errors: under `bash -e` the command substitution aborts the
          # script before the subsequent `echo "$DEPLOY_OUTPUT"` runs, so failed
          # deploys surfaced only as "Process completed with exit code 1" with no
          # visible error. Piping through `tee` fixes that — output reaches the log
          # before the step dies, and `set -o pipefail` keeps the step failing on
          # wrangler errors.
          DEPLOY_LOG=$(mktemp)
          npx wrangler@4 pages deploy dist/ --project-name terraviz --branch "$BRANCH_NAME" --commit-hash ${{ github.sha }} 2>&1 | tee "$DEPLOY_LOG"
          # Extract the preview URL from the captured log. `|| true` guards against
          # a grep no-match (which would otherwise kill the step under `bash -e`)
          # while preserving wrangler's real exit code from the pipeline above.
          PREVIEW_URL=$(grep -oP 'https://[^\s]+\.pages\.dev' "$DEPLOY_LOG" | tail -1 || true)
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          rm -f "$DEPLOY_LOG"
          # Surface the URL in the run summary. It was captured to
          # GITHUB_OUTPUT and never read by any later step, so the only
          # way to find a preview was to scroll the deploy log. The
          # luma-range check ships as a static page under
          # /luma-check/, and reaching it from a phone (iOS Safari is
          # the one browser the LAN-bound --serve mode often cannot
          # reach) means having this link to hand.
          if [ -n "$PREVIEW_URL" ]; then
            {
              echo "### Deployed"
              echo ""
              echo "- $PREVIEW_URL"
              echo "- Luma range check: $PREVIEW_URL/luma-check/page.html"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          # A branch name is attacker-controlled on a fork PR and can
          # carry shell metacharacters, so it reaches the script
          # through the environment instead of being interpolated into
          # it — interpolation would run `$(...)` in a branch name as
          # this step, which holds the Cloudflare token.
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# RRFS smoke — near-surface concentration, North America (13 km)
#
# REVISED for RRFS v1.0, then re-sourced to the operational NODD bucket
# `noaa-rrfs-ops-pds` (the prototype bucket `noaa-rrfs-pds` was retired
# 2026-08-11 and receives nothing further).
#
#   bucket          noaa-rrfs-pds/rrfs_public/  ->  noaa-rrfs-ops-pds/
#   key prefix      rrfs_public/rrfs.DATE/CC/   ->  rrfs.DATE/CC/
#   NA product      2dfld.3km....na             ->  2dfld.13km....na
#   NA resolution   3 km (4881x2961)            ->  13 km (1127x683)
#   NA cadence      hourly, 85 frames           ->  hourly, 85 frames
#   cycles with NA  every hour                  ->  00/06/12/18z only
#   GRIB record     unchanged                   ->  unchanged
#   domain extent   unchanged                   ->  unchanged (rotated_ll)
#
# The ops bucket carries .idx sidecars for every object (922/922 on a
# synoptic cycle) AND publishes the 13 km NA product hourly, where the
# retired prototype mirror only carried it 3-hourly. So this keeps the
# 85 hourly frames and the PT1H period of the dataset it replaces —
# the only loss versus the pre-v1.0 row is NA resolution, 3 km -> 13 km,
# which is a NOAA product decision rather than a pipeline one.
#
# Frame geometry stays at 4030x2080 (26 px/deg), as the frames this
# replaces. It now oversamples the source ~3x; 1240x640 (8 px/deg)
# would match the native 13 km resolution if lighter frames are wanted.
#
# Replaces the pipeline behind: rrfs-smoke-near-surface-north-america
#                               "RRFS Smoke — Near-Surface, North America"
# Measured 2026-08-13 on rrfs.20260811/18 f024: p99.9 = 4.18e-8,
# p99.99 = 1.27e-7, max = 3.54e-6 kg m-3. vmax stays at 2e-7 (the
# published calibration) so hover values and the legend stay
# comparable with previous runs; retune deliberately, not as a side
# effect of this migration.
#
# LAG PT5H clears the measured real-time envelope: three synoptic
# cycles on 2026-08-14 completed +2.98h to +3.59h after cycle time.
stages:
  # 1. Fetch each forecast hour and cut ONE GRIB2 record out of it.
  #    `pattern` is an .idx regex: the runner reads the sidecar and
  #    range-GETs only the matching record, so a 154 MB file costs
  #    ~0.4 MB. This is why the pipeline reads the NODD operational
  #    bucket and not the NOMADS tree that carries the same product —
  #    NOMADS publishes no .idx, and zyra's convert-format hard-fails
  #    without one (there is no whole-file fallback on that path).
  - stage: process
    command: convert-format
    args:
      format: geotiff
      pattern: 'MASSDEN:8 m above ground.*Particulate organic matter dry'
      output_dir: /work/tif
      inputs:
        - https://noaa-rrfs-ops-pds.s3.amazonaws.com/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f000.na.grib2
        - https://noaa-rrfs-ops-pds.s3.amazonaws.com/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f001.na.grib2

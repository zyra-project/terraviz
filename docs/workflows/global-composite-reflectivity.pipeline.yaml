  # 3. The data-encoded render. Luma *is* the dBZ value; the sidecar written
  #    to color_scale_file is what lets the globe recolour it and report a
  #    real number under the cursor. Both keys are required -- `data_encoded`
  #    without `color_scale_file` publishes silently as a flat picture.

# Global composite reflectivity - GFS 0.25 deg, data-encoded.
#
# WHAT THIS IS, AND WHAT IT IS NOT.
# This is the reachable global reflectivity field, not the NSF NCAR MPAS
# 3-km one. GFS parameterises convection: it produces a smooth, synoptic
# reflectivity field with no individual storms in it. It is a real dBZ
# measurement you can hover and query, and it updates itself every cycle --
# but it is a different scientific product from a convection-permitting
# model, and it should not be captioned as if it were one. The MPAS-shaped
# pipeline is the sibling file; see docs/MPAS_3KM_REFLECTIVITY_PLAN.md.
#
# Source:  noaa-gfs-bdp-pds (NODD, open S3 -- no Cloudflare 403 on CI IPs)
# Cycles:  6-hourly (00/06/12/18Z), LAG PT6H
#          Measured 2026-08-12: the 12Z cycle had f048 posted by +5h09m,
#          so PT6H selects a cycle that is already complete end to end.
# Frames:  hourly f000..f048 (49 frames, 2-day outlook)
# Grid:    reprojected 1440x721 -> 4096x2048, stated explicitly rather than
#          left to the default. `reproject` defaults to --width 4096, so
#          OMITTING the size does not keep native resolution -- it upsizes
#          silently. 4096x2048 is also what cli/lib/sos-spec.ts asserts, and
#          what the transcode would scale to anyway; doing it here resamples
#          the DATA (bilinear) instead of the rendered luma, which is the
#          whole reason the contract puts regridding on this stage. It adds
#          no detail the 0.25 deg source lacks.
# Range:   vmin 0, vmax 55 dBZ. Sampled from real records, then confirmed
#          against a full run: peak 53.06 dBZ at 14Z/18Z, ZERO clipped
#          pixels across all 49 frames. ~2 dBZ of headroom -- real but
#          tight, and and the run's peak ran 1.3 dBZ above what sampling
#          three records predicted. Quantisation 0.216 dBZ per luma code.
#          Do not raise vmax without regenerating the palette: these
#          colours are position-pinned (see the heatmap stage).
#
# Output:  frames, not compose-video. The luma carries the values, and
#          compose-video + the HLS transcode would be two lossy generations
#          over them. Ending on the frame set lets the transcode do the
#          single encode and lights up the /frames surface. Cost: set
#          `playback_fps` on the dataset row by hand (~6 suits 49 frames),
#          or the loop plays in well under two seconds.
stages:
  # 1. Fetch one GRIB2 record per lead hour and write it as a GeoTIFF.
  #    `pattern` subsets via the .idx sidecar, so each fetch is a range-GET
  #    of the single reflectivity record rather than the whole ~500 MB file.
  - stage: process
    command: convert-format
    args:
      format: geotiff
      pattern: 'REFC:entire atmosphere'
      output_dir: /work/tif
      inputs:
        - https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{{cycle_date:PT6H:PT6H}}/{{cycle_hour:PT6H:PT6H}}/atmos/gfs.t{{cycle_hour:PT6H:PT6H}}z.pgrb2.0p25.f000

# RRFS smoke — whole-column loading, CONUS (3 km)
#
# REVISED for RRFS v1.0. What changed from the RRFS-A pipeline this
# replaces:
#
#   bucket prefix   rrfs_a/                ->  rrfs_public/
#   product         2dfld.3km....conus     ->  2dfld.3km....conus (same)
#   resolution      3 km (1799x1059)       ->  unchanged
#   cadence         hourly, 85 frames      ->  unchanged
#   cycles          every hour             ->  00/06/12/18z only
#   GRIB record     unchanged              ->  unchanged
#   domain extent   unchanged              ->  unchanged (same Lambert grid)
#
# The CONUS domain survived the v1.0 cutover intact — resolution,
# cadence and grid are all unchanged, so this pipeline keeps its 85
# hourly frames and its 2250x960 geometry.
#
# The one real change: off-synoptic cycles now run only to f018, so a
# full 84 h forecast exists at 00/06/12/18z only. The cycle interval
# moves from hourly to PT6H accordingly — this dataset refreshes 4x a
# day rather than hourly, with the same 84 h outlook as before.
#
# Replaces the pipeline behind: wildfire-smoke-forecast-transparent-united-states-rrfs
#                               "Wildfire Smoke Forecast (Transparent) — United States (RRFS)"
# Measured 2026-08-13 on rrfs.20260811/18 f024: p99.9 = 2.17e-4,
# p99.99 = 6.19e-4, max = 2.26e-3 kg m-2 — vmax 5e-4 sits between
# p99.9 and p99.99, which is where the contract wants it. Unchanged.
stages:
  # 1. Fetch each forecast hour and cut ONE GRIB2 record out of it.
  #    `pattern` is an .idx regex: the runner reads the sidecar and
  #    range-GETs only the matching record, so a 151 MB file costs
  #    ~0.4 MB. This is why the pipeline reads the NODD S3 mirror and
  #    not the NOMADS tree — NOMADS publishes no .idx, so the same
  #    stage there would pull every byte of every forecast hour.
  - stage: process
    command: convert-format
    args:
      format: geotiff
      pattern: 'COLMD:entire atmosphere.*Particulate organic matter dry'
      output_dir: /work/tif
      inputs:
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.3km.f000.conus.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.3km.f001.conus.grib2

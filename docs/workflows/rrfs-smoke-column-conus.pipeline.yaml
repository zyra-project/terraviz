        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.3km.f003.conus.grib2

# RRFS smoke — whole-column loading, CONUS (3 km)
#
# REVISED for RRFS v1.0, then re-sourced to the operational NODD bucket
# `noaa-rrfs-ops-pds` (the prototype bucket `noaa-rrfs-pds` was retired
# 2026-08-11 and receives nothing further).
#
#   bucket        noaa-rrfs-pds/rrfs_public/  ->  noaa-rrfs-ops-pds/
#   key prefix    rrfs_public/rrfs.DATE/CC/   ->  rrfs.DATE/CC/
#   product       2dfld.3km....conus          ->  unchanged
#   resolution    3 km (1799x1059)            ->  unchanged
#   cadence       hourly, 85 frames           ->  unchanged
#   cycles        every hour                  ->  00/06/12/18z only
#   GRIB record   unchanged                   ->  unchanged
#   domain extent unchanged                   ->  unchanged (Lambert)
#
# The CONUS domain came through the v1.0 cutover intact — resolution,
# cadence, grid and record all unchanged — so this keeps its 85 hourly
# frames and its 2250x960 geometry.
#
# The one real change is the cycle interval. The hourly product runs
# only on the 3-hourly cycles (00/03/06/09/12/15/18/21z), and only the
# synoptic four go the full 84 h; 03/09/15/21z stop at f018. An
# 85-frame set therefore needs PT6H, so this dataset refreshes 4x a day
# rather than hourly, with the same 84 h outlook as before.
#
# Not the `subh` product, deliberately. CONUS also publishes
# `2dfld.3km.subh.fNNN.conus.grib2` (f001..f018), which holds the
# 15-minute sub-steps leading up to each hour — f006 carries 315/330/
# 345 min, with the 360 min instant in the hourly f006. But its 156
# records are all precipitation, reflectivity and surface weather
# (APCP, REFC, VIL, GUST, VIS, TMP, ...) and it contains no `aerosol=`
# record at all: no MASSDEN, no COLMD, no AOTK. RRFS writes its
# chemistry output hourly regardless of the dynamics sub-steps, so the
# hourly product is the only source for smoke. `subh` would be the
# right file for a 15-minute radar or precip dataset — and is what
# rrfs-radar-reflectivity-conus uses.
#
# Replaces the pipeline behind: wildfire-smoke-forecast-transparent-united-states-rrfs
#                               "Wildfire Smoke Forecast (Transparent) — United States (RRFS)"
# Measured 2026-08-13 on rrfs.20260811/18 f024: p99.9 = 2.17e-4,
# p99.99 = 6.19e-4, max = 2.26e-3 kg m-2 — vmax 5e-4 sits between
# p99.9 and p99.99, which is where the contract wants it. Unchanged.
#
# LAG PT5H clears the measured real-time envelope: three synoptic
# cycles on 2026-08-14 completed +2.98h to +3.59h after cycle time.
stages:
  # 1. Fetch each forecast hour and cut ONE GRIB2 record out of it.
  #    `pattern` is an .idx regex: the runner reads the sidecar and
  #    range-GETs only the matching record, so a 154 MB file costs
  #    ~0.4 MB. This is why the pipeline reads the NODD operational
  #    bucket and not the NOMADS tree that carries the same product —
  #    NOMADS publishes no .idx, and zyra's convert-format hard-fails
  #    without one (there is no whole-file fallback on that path).
  - stage: process
    command: convert-format
    args:
      format: geotiff
      pattern: 'COLMD:entire atmosphere.*Particulate organic matter dry'
      output_dir: /work/tif
      inputs:
        - https://noaa-rrfs-ops-pds.s3.amazonaws.com/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.3km.f000.conus.grib2
        - https://noaa-rrfs-ops-pds.s3.amazonaws.com/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.3km.f001.conus.grib2
        - https://noaa-rrfs-ops-pds.s3.amazonaws.com/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.3km.f002.conus.grib2

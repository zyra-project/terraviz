        - /work/wrapped/{{valid_compact:P1D:PT12H:PT60H}}.tif
      output_dir: /work/images/frames
      data_encoded: true
      color_scale_file: /work/color-scale.json
      units: "dBZ"
      vmin: 0
      vmax: 75
      # CONTINUOUS is load-bearing, not a colour preference. zyra emits the
      # sidecar's `transparentRange` ONLY for a continuous palette, and that
      # field is the sole declaration that luma 0 means "nothing here" rather
      # than "0 dBZ". Without it datasetStats averages the empty majority of
      # the frame into every statistic, datasetContours traces the no-data
      # footprint, and the hover readout reports 0.00 dBZ over open ocean.
      # (Unmeasured here — this pipeline has no fetchable source yet. On the
      # GFS sibling the same field came out 22.10% covered.)
      # Tracked upstream as NOAA-GSL/zyra#363; if that lands, the classified
      # NWS ramp becomes usable here — see docs/MPAS_3KM_REFLECTIVITY_PLAN.md
      # §5, which has the undo conditions and what they cost.
      # transparent_range/blend_range are luma codes, not dBZ: 17 = 5 dBZ
      # (below it nothing draws) and +68 reaches solid at 25 dBZ.
      cmap_inline: '{"type":"continuous","base":"turbo","transparent_range":17,"blend_range":68,"overall_alpha":0.95}'
      # No width/height (forbidden with data_encoded), no basemap (the globe
      # supplies Earth).

  # 4. Recover the time range from the valid-time frame names.
  - stage: process
    command: scan-frames
    args:
      frames_dir: /work/images/frames
      datetime_format: "%Y%m%dT%H%M%S"
      period_seconds: 3600
      output: /work/frames-meta.json

# No compose-video: frames publish through the image-sequence path, which
# avoids a second lossy generation over value-bearing luma. Set
# `playback_fps` on the dataset row by hand (~8 suits 61 frames).

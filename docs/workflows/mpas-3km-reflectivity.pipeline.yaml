# NSF NCAR MPAS 3-km global composite reflectivity - data-encoded.
#
# ###################################################################
# # THIS PIPELINE CANNOT RUN YET. The host below is a placeholder on
# # the reserved .invalid TLD, so it can never accidentally resolve to
# # somebody else's server. As of 2026-08-12 the NSF NCAR MPAS 3-km
# # global forecast publishes PNG graphics only -- there is no public
# # GRIB2/NetCDF endpoint, no S3 bucket, no THREDDS, and no GDEX/RDA
# # entry. Its own data_access.php says "For real-time data access,
# # send us an email." The run is also not currently live: Spring 2025
# # (ended 30 May 2025) and Fall 2025 are archives.
# #
# # See docs/MPAS_3KM_REFLECTIVITY_PLAN.md for the full source
# # investigation and what has to become true for this to run.
# ###################################################################
#
# TO ACTIVATE, the source URL must satisfy three properties. All three
# are hard requirements, not preferences:
#
#   1. GRIB2 (or NetCDF) on a REGULAR LAT/LON GRID. MPAS's native output
#      is an unstructured Voronoi mesh, and zyra is raster-only -- it
#      cannot read the mesh. NCAR must post an interpolated grid.
#   2. A DATE-TEMPLATABLE PATH. The placeholder grammar has {{cycle_date}}
#      / {{cycle_hour}} and nothing else -- no day-of-year, no 2-digit
#      year. A <YYDDDHHmm> filename cannot be expressed and is a dead end.
#   3. NO CLOUDFLARE IN FRONT. Many *.ucar.edu and *.noaa.gov hosts 403
#      datacenter IPs, which fails the fetch no matter how correct the
#      pipeline is. Verify with a curl from a CI runner, not a laptop.
#
# A REGIONAL source makes the no-data question urgent rather than
# cosmetic: reprojecting a regional grid onto global dst_bounds fills
# everything outside the footprint with NaN, which zyra encodes as luma
# 0. Only the sidecar's `transparentRange` stops the client reporting
# that whole area as a measured 0 dBZ -- see the heatmap stage.
#
# Cycles:  daily 00Z assumed (P1D). LAG PT12H is a PLACEHOLDER -- a 3-km
#          global 60-h forecast takes hours to run and hours more to post,
#          and the lag must cover the whole run posting, not just f000.
#          Measure it against the real feed before enabling the schedule.
# Frames:  hourly f000..f060 (61 frames), matching the 60-h forecast length.
# Grid:    reprojected to 4096x2048, set explicitly (the default happens to
#          match, but a size this load-bearing should not be implicit).
#          Note honestly what that means: 4096 columns over 360 deg is
#          ~0.088 deg, about 9.8 km at the equator. A true 3-km global frame
#          would need ~13333 columns. The globe's frame budget, not the
#          model, is the resolution limit here -- so this shows
#          convection-permitting *structure* resolved to ~10 km, which is
#          still far more than GFS's parameterised smear.
# Range:   vmin 0, vmax 75 dBZ -- UNVERIFIED, unlike the GFS sibling.
#          Convection-permitting models routinely produce 65-70 dBZ cores,
#          and 75 is the NWS ramp ceiling, so nothing clips. Re-measure
#          with scripts/sample_grib_range.py once real records exist.
#          Because the palette is position-pinned, changing vmax changes
#          what every colour means -- regenerate the palette with it, and
#          note that this file and the GFS one deliberately do NOT share a
#          range, so their colours are not directly comparable today.
stages:
  # 1. Fetch one GRIB2 record per lead hour and write it as a GeoTIFF.
  #    `pattern` subsets via the .idx sidecar, so each fetch is a range-GET
  #    of the single reflectivity record rather than the whole ~500 MB file.
  - stage: process
    command: convert-format
    args:
      format: geotiff
      pattern: 'REFC:entire atmosphere'
      output_dir: /work/tif
      inputs:
        - https://REPLACE-WITH-MPAS-HOST.invalid/mpas3km/{{cycle_date:P1D:PT12H}}/{{cycle_hour:P1D:PT12H}}/mpas.t{{cycle_hour:P1D:PT12H}}z.global3km.f000.grib2
        - https://REPLACE-WITH-MPAS-HOST.invalid/mpas3km/{{cycle_date:P1D:PT12H}}/{{cycle_hour:P1D:PT12H}}/mpas.t{{cycle_hour:P1D:PT12H}}z.global3km.f001.grib2

        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT1H:PT4H}}/{{cycle_hour:PT1H:PT4H}}/rrfs.t{{cycle_hour:PT1H:PT4H}}z.2dfld.3km.subh.f012.conus.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT1H:PT4H}}/{{cycle_hour:PT1H:PT4H}}/rrfs.t{{cycle_hour:PT1H:PT4H}}z.2dfld.3km.subh.f013.conus.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT1H:PT4H}}/{{cycle_hour:PT1H:PT4H}}/rrfs.t{{cycle_hour:PT1H:PT4H}}z.2dfld.3km.subh.f014.conus.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT1H:PT4H}}/{{cycle_hour:PT1H:PT4H}}/rrfs.t{{cycle_hour:PT1H:PT4H}}z.2dfld.3km.subh.f015.conus.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT1H:PT4H}}/{{cycle_hour:PT1H:PT4H}}/rrfs.t{{cycle_hour:PT1H:PT4H}}z.2dfld.3km.subh.f016.conus.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT1H:PT4H}}/{{cycle_hour:PT1H:PT4H}}/rrfs.t{{cycle_hour:PT1H:PT4H}}z.2dfld.3km.subh.f017.conus.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT1H:PT4H}}/{{cycle_hour:PT1H:PT4H}}/rrfs.t{{cycle_hour:PT1H:PT4H}}z.2dfld.3km.subh.f018.conus.grib2
      output_names:
        - "{{valid_compact:PT1H:PT4H:PT15M}}.tif"
        - "{{valid_compact:PT1H:PT4H:PT1H15M}}.tif"
        - "{{valid_compact:PT1H:PT4H:PT2H15M}}.tif"
        - "{{valid_compact:PT1H:PT4H:PT3H15M}}.tif"
        - "{{valid_compact:PT1H:PT4H:PT4H15M}}.tif"

# RRFS composite radar reflectivity — CONUS, 15-minute (3 km)
#
# NEW dataset (not a revision). Built on RRFS v1.0's sub-hourly CONUS
# product, `2dfld.3km.subh.fNNN.conus.grib2`.
#
# Shape, and why it differs from the smoke pipelines beside it:
#
#   cadence      15-minute, 73 frames (t+0 .. t+18h)
#   cycles       EVERY hour — subh is published at all 24 cycle hours,
#                so this refreshes hourly rather than 4x a day
#   outlook      18 h (subh runs f001..f018 only)
#   domain       3 km CONUS Lambert, same bounds/geometry as the CONUS
#                smoke row so the two overlay exactly
#
# Each subh file carries FOUR REFC records — the three 15-minute
# sub-steps plus the on-the-hour instant — so f001..f018 alone yields
# 72 frames from t+15m to t+18h. The analysis (t+0) is the one frame
# that has to come from the hourly product.
#
# Why five convert-format stages: `pattern` selects one record per
# file and is a single stage-level arg, so each of the four slots
# needs its own stage. The sub-step minutes are absolute from cycle
# time (subh.f006 holds 315/330/345), not relative, so each pattern
# lists its 18 possible values explicitly.
#
# Measured 2026-08-13 on rrfs.20260811/18 (subh f006 and f012):
# min = -20.0 dBZ exactly (the no-echo fill, and the median of the
# whole domain), max 66.6/67.4, p99.9 47-56, p99.99 60-64. vmax is set
# to 75 rather than to p99.9 on purpose: dBZ is a standard scale with
# conventional breakpoints (20 light, 35 moderate, 45 heavy, 50+ hail)
# and clipping at ~56 would flatten exactly the severe cores this is
# for. 75 dBZ over 243 visible codes still quantises at 0.29 dBZ.
#
# Palette is `turbo` rather than a light-starting map: it runs dark
# blue -> cyan -> green -> yellow -> red, which is the ordering radar
# users read fluently. Faint echo being dim on the dark globe is the
# intended reading here, not a defect.
#
# One record is ~1.1 MB via .idx range-GET, so a full run moves ~80 MB.
#
# NOTE: subh carries NO aerosol fields (no MASSDEN/COLMD/AOTK), which
# is why the smoke pipelines cannot use it and this one cannot carry
# smoke. AK also publishes a subh product if a second domain is ever
# wanted; HI/PR publish theirs at 2.5 km.
stages:
  # 1. The analysis frame (t+0). It lives in the hourly product, not in
  #    subh, and it is the radar-assimilated initial state — the closest
  #    thing here to an observation rather than a forecast.
  - stage: process
    command: convert-format
    args:
      format: geotiff
      pattern: 'REFC:entire atmosphere.*:anl'
      output_dir: /work/tif
      inputs:
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT1H:PT4H}}/{{cycle_hour:PT1H:PT4H}}/rrfs.t{{cycle_hour:PT1H:PT4H}}z.2dfld.3km.f000.conus.grib2
      output_names:
        - "{{valid_compact:PT1H:PT4H}}.tif"
  # 2. Every :15 sub-step (quarter past the hour), f001..f018.
  #    `pattern` must select exactly ONE record per file, and each subh
  #    file holds four — so the minute is pinned explicitly. The values
  #    are absolute minutes from cycle time, which differ per file, so
  #    the alternation lists all 18 rather than matching a suffix.
  - stage: process
    command: convert-format
    args:
      format: geotiff
      pattern: 'REFC:entire atmosphere.*:(15|75|135|195|255|315|375|435|495|555|615|675|735|795|855|915|975|1035) min fcst'

        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT1H:PT4H}}/{{cycle_hour:PT1H:PT4H}}/rrfs.t{{cycle_hour:PT1H:PT4H}}z.2dfld.3km.subh.f007.conus.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT1H:PT4H}}/{{cycle_hour:PT1H:PT4H}}/rrfs.t{{cycle_hour:PT1H:PT4H}}z.2dfld.3km.subh.f008.conus.grib2

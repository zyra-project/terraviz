  # 7. Data-encoded render. vmin is the no-echo threshold, not a
  #    cosmetic floor: `lumaToValue` anchors the visible ramp at
  #    `dataMinLuma` (= ceil(transparent_range/256 * 255)), so
  #    everything below vmin falls in the transparent band and reads as
  #    absent rather than as a measured 0 dBZ. The field's own floor is
  #    a flat -20 dBZ fill covering most of the domain, which is
  #    exactly what wants to disappear.

        - /work/tif/{{valid_compact:P1D:PT30H:PT21H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT24H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT27H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT30H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT33H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT36H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT39H}}.tif

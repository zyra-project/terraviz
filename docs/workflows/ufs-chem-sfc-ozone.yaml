        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT120H}}.tif'

  # 2. The data-encoded render, straight off the mirrored grid.
  - stage: visualize
    command: heatmap
    args:
      inputs:
        - /work/tif/{{valid_compact:P1D:PT30H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT3H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT6H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT9H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT12H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT15H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT18H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT21H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT24H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT27H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT30H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT33H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT36H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT39H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT42H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT45H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT48H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT51H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT54H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT57H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT60H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT63H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT66H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT69H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT72H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT75H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT78H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT81H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT84H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT87H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT90H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT93H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT96H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT99H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT102H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT105H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT108H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT111H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT114H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT117H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT120H}}.tif
      output_dir: /work/images/frames
      data_encoded: true
      color_scale_file: /work/color-scale.json   # OUTPUT -- heatmap writes it
      units: 'ppbv'
      # Ozone is NOT an aerosol. Measured surface field: mean 22.1, p50 22.0,
      # p99.9 49.3, max 59.6 ppbv -- a large non-zero global background, not
      # plumes on clean air. transparent_range 0 keeps the whole field visible;
      # the aerosol convention of 12 would erase most of the atmosphere.
      cmap_inline: '{"type":"continuous","base":"YlOrRd","transparent_range":0,"blend_range":8,"overall_alpha":0.92}'
      vmin: 0
      vmax: 80          # ppbv. Clears the measured max (59.6) with headroom for
                        # forecast hotspots, and keeps the 70 ppbv NAAQS 8-hour
                        # threshold inside the scale rather than clipped.
                        # Clipping would corrupt hover, which is the whole point.
      # NO width/height (forbidden with data_encoded), NO basemap.

  # 3. Derive the dataset time range from the valid-time frame names.
  - stage: process
    command: scan-frames
    args:
      frames_dir: /work/images/frames
      datetime_format: '%Y%m%dT%H%M%S'
      period_seconds: 10800
      output: /work/frames-meta.json


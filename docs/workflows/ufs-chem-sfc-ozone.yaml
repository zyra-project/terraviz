        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT87H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT90H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT93H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT96H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT99H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT102H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT105H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT108H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT111H}}.tif'

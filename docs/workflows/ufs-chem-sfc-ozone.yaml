        - /work/tif/{{valid_compact:P1D:PT30H:PT99H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT102H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT105H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT108H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT111H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT114H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT117H}}.tif
        - /work/tif/{{valid_compact:P1D:PT30H:PT120H}}.tif
      output_dir: /work/wrapped
      dst_bounds: [-180, -90, 180, 90]
      width: 1440
      height: 720

  # 3. The data-encoded render.
  - stage: visualize
    command: heatmap
    args:
      inputs:
        - /work/wrapped/{{valid_compact:P1D:PT30H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT3H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT6H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT9H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT12H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT15H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT18H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT21H}}.tif

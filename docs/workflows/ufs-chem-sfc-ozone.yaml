        - /work/wrapped/{{valid_compact:P1D:PT30H:PT96H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT99H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT102H}}.tif

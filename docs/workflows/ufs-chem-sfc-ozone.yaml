# UFS-Chem global surface ozone -- data-encoded globe dataset.
#
# Design notes: ../UFS_CHEM_SFC_OZONE_PLAN.md
# Calibrated from a real OPeNDAP probe of the 2026-08-17 00z cycle.
#
# ---------------------------------------------------------------------------
# PREREQUISITE: this consumes MIRRORED frames, not GSL THREDDS directly.
#
# gsl.noaa.gov 403s CI egress (plan B1), and one cycle is 121 x 2.21 GB =
# ~267 GB of 3-D atmf files to extract a ~36 MB animation. So a NOAA-side step
# subsets first:
#
#   python3 scripts/mirror-ufs-ozone.py --date <YYYYMMDD> --step 3 --to-ppbv \
#       --out ./ozone-frames
#
# That writes one ~0.3 MB CF NetCDF per frame, named by valid time, with
# lat/lon re-attached (the DAP view drops them) and ppm converted to ppbv
# (zyra cannot rescale units).
#
# Then publish that directory somewhere CI can read, and replace every
# REPLACE-WITH-MIRROR-BASE below with its host.
# ---------------------------------------------------------------------------
#
# DATA-ENCODED CONTRACT: heatmap carries data_encoded + color_scale_file + a
# cmap_inline palette (a named --cmap is IGNORED), and NO width/height/basemap.
# Resolution comes from reproject resampling the DATA. Output is the frame set,
# not an MP4, so the HLS transcode is the only lossy generation.
#
# 41 frames, 3-hourly f000-f120 (5-day forecast).

stages:
  # 1. Mirrored CF NetCDF -> GeoTIFF, one per valid time.
  - stage: process
    command: convert-format
    args:
      format: geotiff
      var: sfc_ozone
      output_dir: /work/tif
      inputs:
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H}}.nc'

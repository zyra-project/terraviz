        - /work/wrapped/{{valid_compact:P1D:PT30H:PT81H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT84H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT87H}}.tif
        - /work/wrapped/{{valid_compact:P1D:PT30H:PT90H}}.tif

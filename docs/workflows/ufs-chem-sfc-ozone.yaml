        - /work/wrapped/{{valid_compact:P1D:PT30H:PT120H}}.tif
      output_dir: /work/images/frames
      data_encoded: true
      color_scale_file: /work/color-scale.json   # OUTPUT -- heatmap writes it
      units: 'ppbv'
      # Ozone is NOT an aerosol. Measured surface field: mean 22.1, p50 22.0,
      # p99.9 49.3, max 59.6 ppbv -- a large non-zero global background, not
      # plumes on clean air. transparent_range 0 keeps the whole field visible;
      # the aerosol convention of 12 would erase most of the atmosphere.
      cmap_inline: '{"type":"continuous","base":"YlOrRd","transparent_range":0,"blend_range":8,"overall_alpha":0.92}'
      vmin: 0
      vmax: 80          # ppbv. Clears the observed max (59.6) with headroom for
                        # forecast hotspots, and keeps the 70 ppbv NAAQS 8-hour
                        # threshold inside the scale rather than clipped.
                        # Clipping would corrupt hover, which is the whole point.
      # NO width/height (forbidden with data_encoded), NO basemap.

  # 4. Derive the dataset time range from the valid-time frame names.
  - stage: process
    command: scan-frames
    args:
      frames_dir: /work/images/frames
      datetime_format: '%Y%m%dT%H%M%S'
      period_seconds: 10800
      output: /work/frames-meta.json

# Publish the FRAME SET (plan §4.5). Set playback_fps on the dataset row, or
# 41 frames play in about a second.

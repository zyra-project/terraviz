# UFS-Chem global surface ozone -- data-encoded globe dataset.
#
# Design notes: ../UFS_CHEM_SFC_OZONE_PLAN.md
# Calibrated from a real OPeNDAP probe of the 2026-08-17 00z cycle.
#
# ---------------------------------------------------------------------------
# PREREQUISITE: this consumes MIRRORED frames, not GSL THREDDS directly.
#
# Two independent reasons the source cannot be read from here:
#   1. gsl.noaa.gov 403s CI egress (plan B1).
#   2. Even reachable, zyra cannot subset it. `extract-variable` is GRIB2-only
#      with no level selector, and `convert-format` reads whole-file bytes
#      (NetCDF -> GeoTIFF is not a supported path). One cycle is 121 x 2.21 GB
#      = ~267 GB holding a ~36 MB animation. See plan §3.6.
#
# So a NOAA-side step subsets first, over OPeNDAP:
#
#   python3 scripts/mirror-ufs-ozone.py --date <YYYYMMDD> --step 3 --to-ppbv \
#       --out ./ozone-frames
#
# That writes one ~3.7 MB GeoTIFF per frame on a regular 1440x720 EPSG:4326
# grid, named by valid time, with ppm converted to ppbv (zyra cannot rescale).
#
# Publish that directory where CI can read it and replace every
# REPLACE-WITH-MIRROR-BASE below with its host.
#
# NOTE: there is deliberately NO `reproject` stage. The mirror already emits
# the target grid, because a Gaussian latitude axis cannot be expressed in a
# GeoTIFF geotransform -- so the regrid has to happen at the point the data is
# still on its native coordinates. Doing it there costs ONE resampling instead
# of two. This is a documented deviation from "reprojection lives in Zyra".
# ---------------------------------------------------------------------------
#
# DATA-ENCODED CONTRACT: heatmap carries data_encoded + color_scale_file + a
# cmap_inline palette (a named --cmap is IGNORED), and NO width/height/basemap.
# Output is the frame set, not an MP4, so the HLS transcode is the only lossy
# generation over luma whose values ARE the data.
#
# 41 frames, 3-hourly f000-f120 (5-day forecast).

stages:
  # 1. Pull the mirrored frames. Batch --inputs names each output by its URL
  #    basename, so /work/tif/<valid-time>.tif falls out automatically.
  - stage: acquire
    command: http
    args:
      output_dir: /work/tif
      inputs:
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT3H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT6H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT9H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT12H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT15H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT18H}}.tif'
        - 'https://REPLACE-WITH-MIRROR-BASE/ufs-chem-ozone/{{cycle_date:P1D:PT30H}}/{{valid_compact:P1D:PT30H:PT21H}}.tif'

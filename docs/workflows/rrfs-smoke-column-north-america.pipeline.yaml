# RRFS smoke — whole-column loading, North America (13 km)
#
# REVISED for RRFS v1.0. What changed from the RRFS-A pipeline this
# replaces:
#
#   bucket prefix   rrfs_a/            ->  rrfs_public/
#   NA product      2dfld.3km....na    ->  2dfld.13km....na
#   NA resolution   3 km (4881x2961)   ->  13 km (1127x683)
#   NA cadence      hourly, 85 frames  ->  3-hourly, 29 frames
#   cycles with NA  every hour         ->  00/06/12/18z only
#   GRIB record     unchanged          ->  unchanged
#   domain extent   unchanged          ->  unchanged (same rotated_ll grid)
#
# The 13 km NA grid covers the same ground as the retired 3 km one, so
# `dst_bounds`, the dataset bbox and the frame geometry all carry over
# untouched. Only the source path and the frame cadence move.
#
# Frame geometry is deliberately left at 4030x2080 (26 px/deg), the
# same as the frames this replaces, so nothing downstream shifts. It
# now oversamples the source ~3x; 1240x640 (8 px/deg) would match the
# new native 13 km resolution if you would rather ship lighter frames.
#
# Replaces the pipeline behind: north-america-smoke
#                               "Wildfire Smoke Overhead"
# Measured 2026-08-13 on rrfs.20260811/18 f024: p99.9 = 1.11e-4,
# p99.99 = 2.82e-4, max = 1.74e-3 kg m-2. vmax stays at 5e-4 (the
# published calibration) so hover values and the legend stay
# comparable with previous runs; retune deliberately, not as a side
# effect of this migration.
stages:
  # 1. Fetch each forecast hour and cut ONE GRIB2 record out of it.
  #    `pattern` is an .idx regex: the runner reads the sidecar and
  #    range-GETs only the matching record, so a 151 MB file costs
  #    ~0.4 MB. This is why the pipeline reads the NODD S3 mirror and
  #    not the NOMADS tree — NOMADS publishes no .idx, so the same
  #    stage there would pull every byte of every forecast hour.
  - stage: process
    command: convert-format
    args:
      format: geotiff
      pattern: 'COLMD:entire atmosphere.*Particulate organic matter dry'
      output_dir: /work/tif
      inputs:
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f000.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f003.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f006.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f009.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f012.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f015.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f018.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f021.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f024.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f027.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f030.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f033.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f036.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f039.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f042.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f045.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f048.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f051.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f054.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f057.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f060.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f063.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f066.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f069.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f072.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f075.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f078.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f081.na.grib2
        - https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.{{cycle_date:PT6H:PT5H}}/{{cycle_hour:PT6H:PT5H}}/rrfs.t{{cycle_hour:PT6H:PT5H}}z.2dfld.13km.f084.na.grib2
      output_names:
        - "{{valid_compact:PT6H:PT5H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT3H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT6H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT9H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT12H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT15H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT18H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT21H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT24H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT27H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT30H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT33H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT36H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT39H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT42H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT45H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT48H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT51H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT54H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT57H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT60H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT63H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT66H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT69H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT72H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT75H}}.tif"

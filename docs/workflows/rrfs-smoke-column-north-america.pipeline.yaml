        - "{{valid_compact:PT6H:PT5H:PT81H}}.tif"
        - "{{valid_compact:PT6H:PT5H:PT84H}}.tif"
  # 2. Reproject the model grid onto an equirectangular frame the globe
  #    can wrap. `width`/`height` give square pixels over `dst_bounds`
  #    (4030 / 155deg = 2080 / 80deg). Resampling the DATA here is
  #    legitimate; resizing the rendered luma later would not be.
  - stage: process
    command: reproject
    args:
      inputs:
        - /work/tif/{{valid_compact:PT6H:PT5H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT3H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT6H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT9H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT12H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT15H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT18H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT21H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT24H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT27H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT30H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT33H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT36H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT39H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT42H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT45H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT48H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT51H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT54H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT57H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT60H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT63H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT66H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT69H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT72H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT75H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT78H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT81H}}.tif
        - /work/tif/{{valid_compact:PT6H:PT5H:PT84H}}.tif
      output_dir: /work/wrapped
      dst_bounds: [-175, 5, -20, 85]
      width: 4030
      height: 2080
  # 3. Render data-encoded frames: pixel luma IS the value. Needs
  #    `data_encoded` + `color_scale_file` together (either alone
  #    publishes a picture with no hover readout), a palette from
  #    `cmap_inline` (a named `cmap` is ignored on this path), and no
  #    width/height/basemap.
  - stage: visualize
    command: heatmap
    args:
      inputs:
        - /work/wrapped/{{valid_compact:PT6H:PT5H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT3H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT6H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT9H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT12H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT15H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT18H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT21H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT24H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT27H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT30H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT33H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT36H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT39H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT42H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT45H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT48H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT51H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT54H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT57H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT60H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT63H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT66H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT69H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT72H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT75H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT78H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT81H}}.tif
        - /work/wrapped/{{valid_compact:PT6H:PT5H:PT84H}}.tif
      output_dir: /work/images/frames
      data_encoded: true
      color_scale_file: /work/color-scale.json
      units: "kg m-2"
      cmap_inline: '{"type":"continuous","base":"YlOrBr","transparent_range":12,"blend_range":48,"overall_alpha":0.95}'
      vmin: 0
      vmax: 0.0005
  # 4. Read the valid times back off the frame filenames so the
  #    metadata template's {{data_start}}/{{data_end}} report what the
  #    frames on disk actually are.
  - stage: process
    command: scan-frames
    args:
      frames_dir: /work/images/frames
      datetime_format: "%Y%m%dT%H%M%S"
      period_seconds: 10800
      output: /work/frames-meta.json

# EMODnet cargo-vessel density -> data-encoded globe animation.
#
# 96 monthly frames (2017-01 .. 2024-12), ship type 09 = "Cargo" from the
# EMODnet Human Activities vessel-density mosaic. Density is hours per square
# kilometre per month. Companion doc: docs/workflows/README.md.
#
# FOUR THINGS HERE LOOK WRONG AND AREN'T. Each was verified against zyra's
# source or against the live service, not assumed.
#
#   1. The fetch is `acquire http --inputs`, not `process convert-format`.
#      convert-format runs its bytes through grib_decode() unconditionally --
#      it has a NetCDF pass-through and nothing else -- so handing it a
#      GeoTIFF fails. `acquire http` takes --inputs + --output-dir.
#
#   2. Every URL ends in `&name=/<frame>.tif`. `acquire http --inputs` names
#      each download `Path(url).name`, which for a bare WCS request is the
#      whole query string. GeoServer ignores the unknown `name` parameter
#      (byte-identical response with and without it) and it moves the URL's
#      last `/` to just before the filename we want, so every frame lands as
#      /work/tif/<YYYYMMDD>T000000.tif -- which the later stages and the
#      frame ordering both depend on.
#
#   3. The quotes in `subset=time(%22...%22)` must stay percent-encoded.
#      A raw `"` makes Tomcat reject the request target with a bare 400
#      before GeoServer ever sees it.
#
#   4. `url:` is set to the bare endpoint and never fetched -- it is the
#      required argparse positional for `acquire http`, and in --inputs mode
#      _cmd_http returns before reading it.
#
# WCS 2.0.1 is deliberate: the 1.0.0 `BBOX`+`CRS` path on this server returns
# a raster tagged with the requested bounds but filled from the wrong window
# of the mosaic. 2.0.1 with outputCrs georeferences correctly (verified by
# probing Gibraltar / Dover / the Bosphorus / Rotterdam against land).
# Spatial subsetting is ignored by this server whichever way it is asked, so
# the request takes the full window and `reproject` crops and pads it onto
# the global frame from each frame's own embedded transform.
#
# CALIBRATION: vmax=10 h/km2/month. Across 2017-01, 2018-07, 2020-04, 2022-03
# and 2024-12 the p99 of non-zero cells is 5.7-8.5 and vmax=10 clips 0.5-0.8%
# of them. Deliberate: the field is strongly log-normal (port basins reach
# ~3000-5000) and zyra has no log transform, so a p99.9 vmax (~106) would
# render the lane network near-black. The cost is real and worth stating --
# above 10 the hover readout under-reports. Lanes are the subject; ports clip.
# transparent_range=2 rather than the aerosol 12: at vmax=10 it drops values
# below 0.078, keeping ~45% of non-zero cells; 12 would keep ~12% and erase
# most of the network.
stages:
  - stage: acquire
    command: http
    args:
      url: https://ows.emodnet-humanactivities.eu/geoserver/wcs
      output_dir: /work/tif
      inputs:
        - 'https://ows.emodnet-humanactivities.eu/geoserver/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=emodnet__vesseldensity_09&format=image/tiff&subset=time(%222017-01-01T00:00:00.000Z%22)&outputCrs=EPSG:4326&scaleSize=i(2728),j(1214)&name=/20170101T000000.tif'
        - 'https://ows.emodnet-humanactivities.eu/geoserver/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=emodnet__vesseldensity_09&format=image/tiff&subset=time(%222017-02-01T00:00:00.000Z%22)&outputCrs=EPSG:4326&scaleSize=i(2728),j(1214)&name=/20170201T000000.tif'
        - 'https://ows.emodnet-humanactivities.eu/geoserver/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=emodnet__vesseldensity_09&format=image/tiff&subset=time(%222017-03-01T00:00:00.000Z%22)&outputCrs=EPSG:4326&scaleSize=i(2728),j(1214)&name=/20170301T000000.tif'
